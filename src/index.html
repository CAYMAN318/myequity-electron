<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyEquity - Gestão Patrimonial</title>
    
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.js"></script>
    <script src="libs/lucide.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f4; overflow: hidden; }
        
        .sidebar-item { transition: all 0.2s ease; border-radius: 12px; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.01em;}
        .sidebar-item.active { background-color: #0f172a; color: #ffffff; }
        .sidebar-item:not(.active):hover { background-color: #e2e8f0; color: #1e293b; }
        
        iframe { width: 100%; height: 100%; border: none; }
        span.icon-wrapper { display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex h-screen w-screen text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">

    <div id="app" class="flex h-full w-full">

        <aside class="w-64 bg-slate-50 border-r border-slate-200 flex flex-col h-full shrink-0 shadow-sm z-10 relative">
            <div class="p-6 pb-2">
                <h1 class="text-2xl font-black text-slate-800 tracking-tighter flex items-center gap-2">
                    <div class="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center">
                        <span class="icon-wrapper text-white" v-html="getIcon('bar-chart-2', 20)"></span>
                    </div>
                    MyEquity
                </h1>
                <p class="text-[10px] uppercase font-bold tracking-widest text-slate-400 mt-2 ml-1 mb-6">Wealth Management</p>
            </div>

            <nav class="flex-1 px-4 overflow-y-auto mt-2">
                <button @click="navegar('dashboard')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'dashboard' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('layout-dashboard', 20)"></span>
                    <span class="text-sm">Dashboard</span>
                </button>

                <button @click="navegar('investimentos')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'investimentos' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('briefcase', 20)"></span>
                    <span class="text-sm">Investimentos (Spot)</span>
                </button>

                <button @click="navegar('derivativos')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'derivativos' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('candlestick-chart', 20)"></span>
                    <span class="text-sm">Mesa de Derivativos</span>
                </button>

                <button @click="navegar('global')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'global' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('globe', 20)"></span>
                    <span class="text-sm">Mercado Global (USD)</span>
                </button>

                <button @click="navegar('dividas')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'dividas' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('credit-card', 20)"></span>
                    <span class="text-sm">Passivos & Dívidas</span>
                </button>

                <button @click="navegar('relatorios')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'relatorios' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('pie-chart', 20)"></span>
                    <span class="text-sm">Relatórios e IRPF</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-200 bg-slate-50/80 backdrop-blur-sm">
                <button @click="navegar('parametros')" :class="['sidebar-item w-full flex items-center gap-3 px-4 py-3', currentPath === 'parametros' ? 'active' : 'text-slate-500']">
                    <span class="icon-wrapper" v-html="getIcon('settings', 20)"></span>
                    <span class="text-sm">Parâmetros</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 h-full bg-white relative overflow-hidden">
            <iframe :src="iframeSrc" id="contentFrame"></iframe>
        </main>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const currentPath = ref('dashboard');
                const iframeSrc = ref('dashboard.html');

                const getIcon = (name, size = 18) => {
                    try {
                        const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                        if (lucide && lucide.icons[iconName]) {
                            return lucide.icons[iconName].toSvg({ 
                                'stroke-width': 2.8,
                                width: size, 
                                height: size 
                            });
                        }
                        return "";
                    } catch(e) { return ""; }
                };

                const navegar = (pagina) => {
                    currentPath.value = pagina;
                    iframeSrc.value = `${pagina}.html`;
                };

                onMounted(() => {
                    setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 150);
                });

                return {
                    currentPath,
                    iframeSrc,
                    navegar,
                    getIcon
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
