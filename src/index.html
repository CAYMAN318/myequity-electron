<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyEquity - Gestão Patrimonial</title>
    
    <!-- Bibliotecas Locais -->
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.js"></script>
    <script src="libs/lucide.js"></script>

    <style>
        /* Mudança 1: Cor de fundo suavizada (um verde bem claro/oliva suave) */
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f4; overflow: hidden; }
        
        /* Ajuste na fonte e transições dos itens da barra lateral */
        .sidebar-item { transition: all 0.2s ease; border-radius: 12px; margin-bottom: 4px; font-weight: 600; /* Suavizando o negrito */ letter-spacing: -0.01em;}
        .sidebar-item.active { background-color: #0f172a; color: #ffffff; }
        .sidebar-item:not(.active):hover { background-color: #e2e8f0; color: #1e293b; }
        
        iframe { width: 100%; height: 100%; border: none; }
        span.icon-wrapper { display: inline-flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="h-screen flex">

    <div id="app" class="flex w-full h-full">
        
        <!-- Menu Lateral (Sidebar) -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col p-6 shadow-sm z-10">
            <!-- Logotipo do App -->
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white shadow-md">
                    <span class="icon-wrapper" v-html="getIcon('bar-chart', 24)"></span>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight leading-none">MyEquity</h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Gestão Patrimonial</p>
                </div>
            </div>

            <!-- Navegação -->
            <nav class="space-y-1 flex-1">
                <button @click="navegar('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 text-sm sidebar-item" :class="currentPath === 'dashboard' ? 'active' : 'text-slate-600'">
                    <span class="icon-wrapper" v-html="getIcon('layout-dashboard')"></span> Dashboard
                </button>
                <button @click="navegar('investimentos')" class="w-full flex items-center gap-3 px-4 py-3 text-sm sidebar-item" :class="currentPath === 'investimentos' ? 'active' : 'text-slate-600'">
                    <span class="icon-wrapper" v-html="getIcon('briefcase')"></span> Investimentos
                </button>
                <button @click="navegar('dividas')" class="w-full flex items-center gap-3 px-4 py-3 text-sm sidebar-item" :class="currentPath === 'dividas' ? 'active' : 'text-slate-600'">
                    <span class="icon-wrapper" v-html="getIcon('credit-card')"></span> Passivos
                </button>
                
                <button @click="navegar('relatorios')" class="w-full flex items-center gap-3 px-4 py-3 text-sm sidebar-item" :class="currentPath === 'relatorios' ? 'active' : 'text-slate-600'">
                    <span class="icon-wrapper" v-html="getIcon('bar-chart-2')"></span> Relatórios
                </button>
                
                <!-- Separador visual com mt-6 e uma borda sutil no topo para o botão Parâmetros -->
                <div class="mt-6 pt-2 border-t border-slate-100">
                    <button @click="navegar('parametros')" class="w-full flex items-center gap-3 px-4 py-3 text-sm sidebar-item" :class="currentPath === 'parametros' ? 'active' : 'text-slate-600'">
                        <span class="icon-wrapper" v-html="getIcon('settings')"></span> Parâmetros
                    </button>
                </div>
            </nav>

            <!-- Rodapé da Sidebar -->
            <div class="mt-auto pt-6 border-t border-slate-100 px-2">
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-bold text-xs">AE</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-bold text-slate-700 truncate">Aurélio V2</p>
                        <p class="text-[10px] font-medium text-slate-400">v2.4.0</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Área de Conteúdo (Iframe) -->
        <main class="flex-1 h-full overflow-hidden relative">
            <iframe :src="iframeSrc" id="contentFrame"></iframe>
        </main>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const currentPath = ref('dashboard');
                const iframeSrc = ref('dashboard.html');

                const getIcon = (name, size = 18) => {
                    try {
                        const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                        if (lucide && lucide.icons[iconName]) {
                            return lucide.icons[iconName].toSvg({ 
                                'stroke-width': 2.8,
                                width: size, 
                                height: size 
                            });
                        }
                        return "";
                    } catch(e) { return ""; }
                };

                const navegar = (pagina) => {
                    currentPath.value = pagina;
                    iframeSrc.value = `${pagina}.html`;
                };

                onMounted(() => {
                    setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 150);
                });

                return {
                    currentPath,
                    iframeSrc,
                    navegar,
                    getIcon
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
